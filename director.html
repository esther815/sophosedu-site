  function vblob(i){var x=vlist[i];return (x.s?sdec('f/'+x.f):vdec(x.f)).then(function(d){return new Blob([d],{type:x.mime||'application/octet-stream'})})}
  var RK={};
  function roomKey(dir){if(RK[dir])return Promise.resolve(RK[dir]);return sb.rpc(dir==='t'?'sp_teacher_key':'sp_lib_key').then(function(r){if(r.error||!r.data)throw new Error(dir==='t'?'강사방 설정 SQL을 먼저 실행해 주십시오.':'서재 열쇠를 받지 못했습니다.');return crypto.subtle.importKey('raw',b64(r.data),{name:'AES-GCM'},false,['decrypt','encrypt'])}).then(function(k){RK[dir]=k;return k})}
  function rEnc(k,buf){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,buf).then(function(c){var o=new Uint8Array(12+c.byteLength);o.set(iv,0);o.set(new Uint8Array(c),12);return new Blob([o],{type:'application/octet-stream'})})}
  function rPut(dir,path,buf){return roomKey(dir).then(function(k){return rEnc(k,buf)}).then(function(b){return sb.storage.from('sp-room').upload(dir+'/'+path,b,{upsert:true,contentType:'application/octet-stream',cacheControl:'0'})}).then(function(r){if(r.error)throw r.error})}
  function rIndex(dir){return roomKey(dir).then(function(k){return sb.storage.from('sp-room').download(dir+'/index.bin?t='+Date.now()).then(function(r){if(r.error)return [];return r.data.arrayBuffer().then(function(b){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b.slice(0,12))},k,b.slice(12))}).then(function(d){return JSON.parse(new TextDecoder().decode(d))})}).catch(function(){return []})})}
  var AUD={all:'학부모·학생 모두','학부모':'학부모방만','학생':'학생방만'};
  function roomsList(){var box=document.getElementById('rlbox');box.innerHTML='<p class="empty">불러오는 중…</p>';
    Promise.all([rIndex('t').catch(function(){return []}),rIndex('m').catch(function(){return []})]).then(function(a){
      function sec(dir,name,list){return '<p class="g" style="margin-top:14px">'+name+'</p>'+(list.length?list.map(function(x){return '<div class="vi"><div><b>'+esc(x.title)+'</b><span>'+esc(x.group||'')+(dir==='m'?' · '+AUD[x.aud||'all']:'')+' · '+kb(x.size)+' · '+esc(x.t||'')+'</span></div><button type="button" class="x" data-rx="'+dir+'|'+esc(x.f)+'">지우기</button></div>'}).join(''):'<p class="empty">없습니다.</p>')}
      box.innerHTML=sec('t','강사방',a[0])+sec('m','학부모방 · 학생방',a[1]);
    })}
  function today(){var d=new Date();return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()}
  function refresh(){vhtml=null;load()}
  document.addEventListener('change',function(e){if(e.target.id==='vfile'){var f=e.target.files[0];document.getElementById('vgo').disabled=!f;document.getElementById('vst').textContent=f?f.name+' · '+kb(f.size):''}});
  document.addEventListener('click',function(e){
    var sa=e.target.closest('[data-sa]'),ss=e.target.closest('[data-ss]'),sd=e.target.closest('[data-sd]'),rx=e.target.closest('[data-rx]');
    function sset(i,v){sb.rpc('sp_staff_set',{p_id:STAFF[i].id,p_status:v}).then(function(r){if(r.error||r.data!=='ok'){alert('처리하지 못했습니다.');return}load()})}
    if(sa){sset(+sa.dataset.sa,'approved');return}
    if(ss){if(confirm(STAFF[+ss.dataset.ss].name+' 선생님의 강사방 이용을 중지할까요?'))sset(+ss.dataset.ss,'stopped');return}
    if(sd){if(confirm(STAFF[+sd.dataset.sd].name+' 선생님을 명단에서 삭제할까요?'))sset(+sd.dataset.sd,'delete');return}
    if(e.target.id==='icp'){var tx=document.getElementById('ilink').textContent;(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){e.target.textContent='복사됨'},function(){prompt('아래 링크를 길게 눌러 복사하세요',tx)});return}
    if(e.target.id==='ish'){navigator.share({title:'소포스에듀 강사방 초대',text:'소포스에듀 강사방 초대 링크입니다. 카카오로 로그인한 뒤 이름·과목을 적어 주시면 승인해 드립니다.',url:document.getElementById('ilink').textContent}).catch(function(){});return}
    if(e.target.id==='inew'){if(!confirm('새 초대 링크로 바꿀까요? 이전 링크로는 더 가입할 수 없습니다.'))return;sb.rpc('sp_teacher_invite',{p_new:true}).then(function(){load()});return}
    if(e.target.id==='rlist'){roomsList();return}
    if(rx){var pr=rx.dataset.rx.split('|'),dir=pr[0],fid=pr[1];if(!confirm('이 자료를 지울까요? 지우면 되살릴 수 없습니다.'))return;
      rIndex(dir).then(function(ix){ix=ix.filter(function(y){return y.f!==fid});return rPut(dir,'index.bin',new TextEncoder().encode(JSON.stringify(ix)))}).then(function(){return sb.storage.from('sp-room').remove([dir+'/f/'+fid])}).then(roomsList).catch(function(err){alert('지우지 못했습니다. '+(err&&err.message?err.message:''))});return}
    var sh=e.target.closest('[data-s]');
    if(sh){var q=+sh.dataset.s;vblob(q).then(function(b){var fl=new File([b],vlist[q].name,{type:b.type});return navigator.share({files:[fl],title:vlist[q].title})}).catch(function(err){if(err&&err.name!=='AbortError')alert('보내지 못했습니다. 내려받은 뒤 카톡에서 첨부해 주십시오.')});return}
    var d=e.target.closest('[data-d]'),v=e.target.closest('[data-v]'),x=e.target.closest('[data-x]');
    if(e.target.id==='vgo'){
      var f=document.getElementById('vfile').files[0],st=document.getElementById('vst'),btn=e.target;if(!f)return;
      if(f.size>50*1048576){st.textContent='50MB가 넘는 파일은 올릴 수 없습니다.';return}
      btn.disabled=true;st.textContent='잠그고 올리는 중…';
      var id=Array.from(crypto.getRandomValues(new Uint8Array(9))).map(function(n){return('0'+n.toString(16)).slice(-2)}).join('')+'.bin';
      var t=(document.getElementById('vtitle').value||'').trim()||f.name.replace(/\.[^.]+$/,'');
      var to=document.getElementById('vto').value;
      if(to!=='vault'){var dir=to.charAt(0),aud=to.indexOf(':')>0?to.split(':')[1]:'';
        f.arrayBuffer().then(function(buf){return rPut(dir,'f/'+id,buf)}).then(function(){return rIndex(dir)}).then(function(ix){var it={group:document.getElementById('vgrp').value,title:t.slice(0,80),name:f.name,mime:f.type||'application/octet-stream',size:f.size,f:id,t:today()};if(dir==='m')it.aud=aud;ix.push(it);return rPut(dir,'index.bin',new TextEncoder().encode(JSON.stringify(ix)))}).then(function(){st.textContent=(dir==='t'?'강사방':AUD[aud])+'에 올렸습니다.';btn.disabled=false;var b2=document.getElementById('rlbox');if(b2&&b2.innerHTML)roomsList()}).catch(function(err){btn.disabled=false;st.textContent='올리지 못했습니다. '+(err&&err.message?err.message:'')});
        return;
      }
      f.arrayBuffer().then(function(buf){return sput('f/'+id,buf)}).then(sindex).then(function(ix){ix.push({group:document.getElementById('vgrp').value,title:t.slice(0,80),name:f.name,mime:f.type||'application/octet-stream',size:f.size,f:id,t:today()});return sput('index.bin',new TextEncoder().encode(JSON.stringify(ix)))}).then(function(){st.textContent='올렸습니다.';refresh()}).catch(function(err){btn.disabled=false;st.textContent='올리지 못했습니다. '+(err&&err.message?err.message:'')});
      return;
    }
    if(x){var k=+x.dataset.x,it=vlist[k];if(!window.confirm('「'+it.title+'」을 서류함에서 지울까요? 지우면 되살릴 수 없습니다.'))return;
      sindex().then(function(ix){ix=ix.filter(function(y){return y.f!==it.f});return sput('index.bin',new TextEncoder().encode(JSON.stringify(ix)))}).then(function(){return sb.storage.from(BK).remove(['f/'+it.f])}).then(refresh).catch(function(err){alert('지우지 못했습니다. '+(err&&err.message?err.message:''))});return}
    if(d){var i=+d.dataset.d;vblob(i).then(function(b){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=vlist[i].name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)})}
    if(v){var j=+v.dataset.v;vblob(j).then(function(b){var u=URL.createObjectURL(b),box=document.getElementById('vpb'),m=vlist[j].mime||'';document.getElementById('vpt').textContent=vlist[j].title;box.innerHTML=m.indexOf('image')===0?'<img src="'+u+'" alt="">':(m==='application/pdf'||m.indexOf('text')===0)?'<iframe src="'+u+'"></iframe>':'<p style="color:#F1E3C3;margin:30px">이 파일은 미리보기가 되지 않습니다. 내려받기로 여십시오.</p>';document.getElementById('vp').classList.add('on')})}
  });
  document.getElementById('vpx').onclick=function(){document.getElementById('vp').classList.remove('on');document.getElementById('vpb').innerHTML=''};
  var vhtml=null;
  // 방 열어 보기 · 강사 관리
  var ST={pending:'승인 대기',approved:'승인됨',stopped:'중지'}, STAFF=[];
  function rooms(){
    var doors='<section class="panel"><h2>방 열어 보기 <small>각 방이 실제로 어떻게 열리는지 원장 계정으로 미리 봅니다</small></h2><div class="doors">'+
      [['parent','학부모방','학부모 회원이 보는 화면'],['student','학생방','학생 회원(만 14세 이상)이 보는 화면'],['teacher','강사방','승인된 강사가 보는 화면'],['join','회원 가입 화면','처음 온 학부모·학생'],['tjoin','강사 가입 화면','초대 링크로 온 강사']].map(function(d){return '<a href="member.html?as='+d[0]+'"><b>'+d[1]+'</b><span>'+d[2]+'</span></a>'}).join('')+'</div></section>';
    return Promise.all([sb.rpc('sp_teacher_invite',{p_new:false}),sb.rpc('sp_staff_list')]).then(function(a){
      if(a[0].error||!a[0].data)return doors+'<section class="panel"><h2>강사 관리</h2><p class="empty">강사방 설정 SQL(소포스_방나누기_설정.sql)을 실행하면 강사 초대 링크와 명단이 여기에 나타납니다.</p></section>';
      var link='https://sophosedu.co.kr/member.html?t='+a[0].data; STAFF=a[1].data||[];
      return doors+'<section class="panel"><h2>강사 관리 <small>초대 링크를 받은 강사가 가입하면 승인해 주십시오</small></h2>'+
        '<div class="inv"><code id="ilink">'+esc(link)+'</code><button type="button" id="icp">복사</button>'+(navigator.share?'<button type="button" class="sh" id="ish">카톡 전달</button>':'')+'<button type="button" id="inew">새 링크로 바꾸기</button></div>'+
        '<p class="note" style="margin:0 0 6px;font-size:13px;color:var(--muted)">새 링크로 바꾸면 이전 링크로는 더 가입할 수 없습니다. 이미 승인된 강사는 그대로입니다.</p>'+
        (STAFF.length?STAFF.map(function(x,i){return '<div class="stf"><div><b>'+esc(x.name)+'</b><span class="bd '+x.status+'">'+ST[x.status]+'</span><br><span>'+esc(x.subject||'')+(x.phone?' · '+esc(x.phone):'')+' · 신청 '+when(x.created_at)+'</span></div>'+
          (x.status!=='approved'?'<button type="button" class="ok" data-sa="'+i+'">승인</button>':'<button type="button" data-ss="'+i+'">중지</button>')+'<button type="button" data-sd="'+i+'">삭제</button></div>'}).join(''):'<p class="empty">아직 가입한 강사가 없습니다.</p>')+
        '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><button type="button" class="rlb" id="rlist">강사방 · 회원방에 올린 자료 보기</button><div id="rlbox"></div></div></section>';
    });
  }
  function load(){Promise.all([sb.rpc('sp_funnel',{p_days:days}),vhtml?Promise.resolve(vhtml):vault(),rooms().catch(function(){return ''})]).then(function(a){var r=a[0];vhtml=a[1];var rh=a[2];if(r.error){M.innerHTML=vhtml+rh+'<p class="deny">불러오지 못했습니다. '+esc(r.error.message)+'</p>';return}render(r.data);M.insertAdjacentHTML('afterbegin',vhtml+rh)})}
  document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;days=+b.dataset.d;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});load()});
  sb.auth.getSession().then(function(s){
    if(!s.data.session){try{sessionStorage.setItem('sp_next','director')}catch(_){}location.replace('member.html');return}
    sb.rpc('is_admin').then(function(a){if(a.data!==true){M.innerHTML='<p class="deny">원장 계정으로만 열 수 있습니다.</p>';return}load()});
  });
})();
</script>
<script src="/nav.js" defer></script>
</body>
